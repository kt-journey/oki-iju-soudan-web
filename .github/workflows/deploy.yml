# おき暮らしごっこ LP を Xserver へデプロイするワークフロー
#
# 実行方法: GitHub の Actions タブ > "Deploy to Xserver" > Run workflow（手動実行のみ）
#
# 【初回実行前の必須条件】
# 1. リポジトリの Settings > Secrets and variables > Actions に
#    FTP_SERVER / FTP_USERNAME / FTP_PASSWORD を登録すること
# 2. 下の server-dir が Xserver 上の実際の設置パスと一致しているか
#    ファイルマネージャで確認すること（末尾の / 必須）
# 3. Mac ローカルの最新状態をこのリポジトリへ取り込み済みであること
#    ※ リポジトリが古いまま実行すると、公開サイトが古い内容に巻き戻ります

name: Deploy to Xserver

on:
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          # 要確認: Xserver 上の設置パス（ドメインの public_html 配下の ijutaiken フォルダ）
          server-dir: /oki-ijukeikaku.net/public_html/ijutaiken/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
